site_name: TinyTracer
site_description: Design documentation for TinyTracer, a ray-tracing graphics chip for Tiny Tapeout by the University of Waterloo ASIC Design Team.
site_url: https://uw-asic.github.io/TinyTracer/

# Sidebar entries are written as "name — description". The override in
# theme_overrides/nav.html renders the name in code font.
# Not part of the design docs site: the Tiny Tapeout datasheet and the
# docs build requirements.
exclude_docs: |
  info.md
  requirements.txt

nav:
  - Home: index.md
  - Introduction:
      - Introduction: introduction.md
  - Encoding:
      - "Number Formats": encoding/number_format.md
      - "Scene Encoding": encoding/scene.md
      - "Instruction Encoding": encoding/instruction.md
      - "UART Frame Encoding": encoding/uart_frame.md
  - TinyTracer:
      - "tt_um_tinytracer — Top-Level Module for TinyTracer": modules/tt_um_tinytracer.md
      - "tinytracer_if — Interfaces between TinyTracer modules": modules/tinytracer_if.md
  - SRAM:
      - "sram_control — SRAM Controller": modules/sram/sram_control.md
      - "scene_sram — Scene SRAM": modules/sram/scene_sram.md
      - "IHP SRAM macro — Integration of the scene SRAM macro": modules/sram/ihp_sram_macro.md
  - I/O:
      - "io — Communicates with external device to load scenes and render pixels": modules/io/io.md
      - "uart — UART transceiver": modules/io/uart.md
      - "clkdiv — Derives a clock as an arbitrary fraction of clk": modules/io/clkdiv.md
  - RTU:
      - "rtu — Instantiates Ray Generator, Intersection Unit, and Shader Core": modules/rtu/rtu.md
      - "ray_generator — Generates primary and secondary rays": modules/rtu/ray_gen/ray_generator.md
      - "rng — Random number generator": modules/rtu/ray_gen/rng.md
      - "intersection_unit — Computes ray-object intersection": modules/rtu/intersection_unit.md
      - "shader_core — Colours pixels based on ray-object intersection results and material metadata": modules/rtu/shader_core.md
  - EXU:
      - "exu — Instantiates Decode Unit, Register File, and Functional Units": modules/exu/exu.md
      - "decode — Decodes messages between the RTU and FUs": modules/exu/decode.md
      - "reg_file — Register file for the FUs": modules/exu/reg_file.md
      - "fu_control — Instantiates functional units": modules/exu/functional_units/fu_control.md
      - "alu — Fixed-point ALU": modules/exu/functional_units/alu.md
      - "cordic — CORDIC Unit": modules/exu/functional_units/cordic.md
      - "multiplier — Fixed-point multiplier": modules/exu/functional_units/multiplier.md
  - Accumulator:
      - "accumulator — Buffer between the RTU and I/O Unit": modules/accumulator/accumulator.md

theme:
  name: readthedocs
  custom_dir: theme_overrides
  include_homepage_in_sidebar: false
  sticky_navigation: false   # sidebar keeps its own scrollbar; page scrolling no longer drags it

extra_css:
  - css/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - js/sidebar-scroll.js
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
