site_name: TinyTracer

# Sidebar entries are written as "name: description". The override in
# theme_overrides/nav.html renders the name in code font.
nav:
  - Home: index.md
  - Introduction:
      - Introduction: introduction.md
  - Encoding:
      - "Scene Encoding": encoding/scene.md
      - "Instruction Encoding": encoding/instruction.md
      - "UART Frame Encoding": encoding/uart_frame.md
  - TinyTracer:
      - "tt_um_tinytracer: Top-level module for TinyTracer": modules/tt_um_tinytracer.md
  - SRAM:
      - "sram_control: SRAM Controller": modules/sram/sram_control.md
  - I/O:
      - "io: UART wrapper that receives input commands and streams pixel data out": modules/io/io.md
      - "uart: Parses UART frames": modules/io/uart.md
  - RTU:
      - "rtu: Ray-tracing unit that carries out ray-tracing algorithm": modules/rtu/rtu.md
      - "ray_generator: Generates primary and secondary rays": modules/rtu/ray_generator.md
      - "intersection_unit: Computes ray-object intersection": modules/rtu/intersection_unit.md
      - "shader_core: Colours pixels based on ray-object intersection results and material metadata": modules/rtu/shader_core.md
  - FU:
      - "fu_control: Top-level wrapper for functional units": modules/fu/fu_control.md
      - "alu: Fixed-point ALU": modules/fu/alu.md
      - "cordic: CORDIC unit": modules/fu/cordic.md
      - "multiplier: Fixed-point multiplier": modules/fu/multiplier.md
      - "rng: Xorshift-based random number generator": modules/fu/rng.md
      - "invsqrt: Computes inverse square roots": modules/fu/invsqrt.md
  - Decode:
      - "decode: Decodes messages between the RTU and FUs": modules/decode/decode.md
  - Register File:
      - "reg_file: Register file for the FUs": modules/reg_file/reg_file.md
  - Accumulator:
      - "accumulator: Buffer for the RTU to write pixel sample results to": modules/accumulator/accumulator.md

theme:
  name: readthedocs
  custom_dir: theme_overrides
  include_homepage_in_sidebar: false
  sticky_navigation: false   # sidebar keeps its own scrollbar; page scrolling no longer drags it

extra_css:
  - css/extra.css

extra_javascript:
  - js/sidebar-scroll.js
